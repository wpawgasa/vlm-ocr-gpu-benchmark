# Debug config for development
name: single_model_debug
description: "Single model debug configuration"

models:
  - paddleocr_vl_0.9b

gpus:
  - h100_sxm

phases:
  - inference

inference:
  batch_sizes: [1]
  resolutions: [1024]
  max_output_tokens_sweep: [128]
  precision_modes: [bf16]
  warmup_requests: 0
  measurement_requests: 1
  runs_per_config: 1
  cooldown_seconds: 0

profiling:
  enabled: false
