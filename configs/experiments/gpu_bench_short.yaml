# Short GPU benchmark: inference, training, and quality across model sizes
# Measures GPU performance characteristics with minimal workloads.
name: gpu_bench_short
description: "Quick GPU benchmark — 3 model tiers, all phases, minimal settings"

models:
  - paddleocr_vl_0.9b   # 0.9B — ultra compact
  - nanonets_ocr2_3b     # 3B — compact
  - olmocr2_7b           # 7B — midsize

gpus:
  - b300_sxm

phases:
  - inference
  - training

inference:
  batch_sizes: [1, 8, 32]
  resolutions: [1024]
  max_output_tokens_sweep: [2048]
  precision_modes: [bf16]
  warmup_requests: 10
  measurement_requests: 50
  runs_per_config: 1
  cooldown_seconds: 10

training:
  epochs: 1
  micro_batch_sizes: [1, 2, 4]
  precision_modes: [bf16]
  dataset: docmatix_50k
  runs_per_config: 1
  measurement_steps: 100
  warmup_steps: 10

quality:
  benchmarks:
    - omnidocbench_v1.5
  metrics:
    - edit_distance
    - bleu
    - meteor
  precision_modes: [bf16]
  per_document_type: false
  max_samples: 50
