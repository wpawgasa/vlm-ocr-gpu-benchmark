# Quick smoke test: 1 model, 1 batch size — CI validation
name: quick_smoke
description: "Minimal smoke test for CI validation"

models:
  - paddleocr_vl_0.9b

gpus:
  - b300_sxm

phases:
  - inference

inference:
  batch_sizes: [1]
  resolutions: [1024]
  max_output_tokens_sweep: [256]
  precision_modes: [bf16]
  warmup_requests: 5
  measurement_requests: 10
  runs_per_config: 1
  cooldown_seconds: 5
