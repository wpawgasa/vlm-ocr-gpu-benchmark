[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-ocr-bench"
version = "1.0.0"
description = "Reproducible GPU benchmarking framework for document OCR Vision-Language Models"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    # Core ML
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "deepspeed>=0.15.0",
    # Inference
    "vllm>=0.6.0",
    # Data
    "datasets>=3.0.0",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    # Evaluation
    "nltk>=3.9.0",
    "pythainlp>=5.0.0",
    "editdistance>=0.8.0",
    "sacrebleu>=2.4.0",
    # Profiling
    "pynvml>=12.0.0",
    # Analysis
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "pyarrow>=17.0.0",
    # Config & CLI
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Logging
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
vlm-ocr-bench = "vlm_ocr_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "peft.*",
    "accelerate.*",
    "deepspeed.*",
    "vllm.*",
    "datasets.*",
    "pynvml.*",
    "nltk.*",
    "pythainlp.*",
    "editdistance.*",
    "sacrebleu.*",
    "pdf2image.*",
    "plotly.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU (deselect with '-m \"not gpu\"')",
    "slow: slow tests (deselect with '-m \"not slow\"')",
]
